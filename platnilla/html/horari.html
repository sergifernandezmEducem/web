<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Plantilla</title>
    <meta name="description" content="Plantilla">
    <meta name="author" content="Sergi">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Horari</h1>
    </header>
    <main>
        <table border="1">
            <thead class="dias">
                <tr>
                    <th></th>
                    <th>Dilluns</th>
                    <th>Dimarts</th>
                    <th>Dimecres</th>
                    <th>Dijous</th>
                    <th>Divendres</th>
                </tr>
            </thead>
            <tr>
                <td class="horario">8:00-9:00</td>
                <td rowspan="2" class="aso">ASO</td>
                <td rowspan="3" class="bbdd">BBDD</td>
                <td rowspan="2" class="hlld">HLLD</td>
                <td rowspan="2"></td>
                <td rowspan="2" class="aso">ASO</td>
            </tr>
            <tr>
                <td>9:00-10:00</td>
            </tr>
            <tr>
                <td>10:00-11:00</td>
                <td class="marques">MARQUES</td>
                <td class="tutoria">TUTORIA</td>
                <td class="bbdd">BBDD</td>
                <td class="sx">SX</td>
            </tr>
            <tr>
                <td>11:00-11:30</td>
                <td colspan="5" class="pati">Pati</td>
            </tr>
            <tr>
                <td>11:30-12:30</td>
                <td class="marques">MARQUES</td>
                <td rowspan="3" class="iso">ISO</td>
                <td class="fm">FM</td>
                <td class="bbdd">BBDD</td>
                <td class="sx">SX</td>
            </tr>
            <tr>
                <td>12:30-13:30</td>
                <td class="hlld">HLLD</td>
                <td rowspan="2"></td>
                <td class="iso">ISO</td>
                <td class="fm">FM</td>
            </tr>
            <tr>
                <td>13:30-14:30</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>
    </main>
</body>
</html>
